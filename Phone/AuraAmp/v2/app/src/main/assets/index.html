/* v1.0.5: fullscreen-width floating top mini dock, native-safe vertical offset */
:root{--aura-mini-top: max(30px, env(safe-area-inset-top, 0px));}
.screen.with-mini .scroll-area{padding-top:152px}
.mini-player{
  left:0;right:0;width:100%;top:var(--aura-mini-top);
  height:106px;border-radius:28px;
  background:var(--nav);border:1px solid var(--outline);
  box-shadow:0 10px 28px #00000020;
}
.mini-main{height:82px;padding:11px 22px 0 23px;gap:12px}
.mini-text strong{font-size:16px}.mini-text small{font-size:13px}
.mini-control{width:46px;height:46px;font-size:23px}
.mini-grab{height:22px}.mini-grab span{width:46px;height:4px}
@media(max-width:620px){
  .screen.with-mini .scroll-area{padding-top:calc(157px + env(safe-area-inset-top, 0px))}
  .mini-player{top:max(32px, env(safe-area-inset-top, 0px));left:0;right:0}
}
@media(min-width:621px){.mini-player{top:12px}}

/* v1.0.8: playback hotfix + LP mini player */
.mini-main{padding:12px 20px 0 18px;gap:14px}
.mini-player{height:112px;border-radius:28px;background:var(--nav)}
.mini-vinyl{position:relative;width:58px;height:58px;flex-shrink:0;border:0;background:none;padding:0;display:grid;place-items:center}
.vinyl-disc{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 50% 50%, #1f222d 0 18%, #111318 19% 40%, #2c303c 41% 43%, #111318 44% 62%, #242836 63% 66%, #0f1015 67% 100%);box-shadow:0 6px 16px #0000002a}
[data-theme="light"] .vinyl-disc{background:radial-gradient(circle at 50% 50%, #f0f0f2 0 18%, #dadce2 19% 40%, #babec8 41% 43%, #e9ebef 44% 62%, #c4c8d1 63% 66%, #d9dbe1 67% 100%)}
.vinyl-label{position:relative;z-index:1;width:26px;height:26px;border-radius:50%;overflow:hidden;background:var(--orange);display:grid;place-items:center;color:#fff;font-size:12px;font-weight:800;box-shadow:0 0 0 2px #ffffff12}
.vinyl-label img{width:100%;height:100%;object-fit:cover;display:block}
.mini-vinyl.spinning{animation:vinylSpin 5.2s linear infinite}
@keyframes vinylSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.mini-text strong{font-size:15px;font-weight:760;line-height:1.1}.mini-text small{font-size:12px;line-height:1.1}
.mini-marquee{display:flex;align-items:center}
.mini-control{width:42px;height:42px;font-size:22px}
@media(max-width:620px){.mini-player{height:116px}.mini-vinyl{width:60px;height:60px}.mini-main{height:88px;padding:14px 18px 0 18px}}

/* v1.0.9: artwork is a real Play target, same flat visual appearance */
.song-art-play{display:grid;place-items:center;flex-shrink:0;width:57px;height:57px;border:0;background:none;padding:0;border-radius:9px;overflow:hidden}
.song-art-play img,.song-art-play .placeholder-cover{width:100%;height:100%;object-fit:cover;border-radius:9px}
.song-art-play:active{transform:scale(.96)}
@media(min-width:621px){.song-art-play{width:57px;height:57px}}

/* AURA AMP v1.1.0 Flat UIX: exact dark family, artist catalog and lyrics */
[data-theme="dark"]{--canvas:#0c101b;--phone:#1b1d24;--nav:#25272e;--ink:#f6f4f4;--secondary:#a9a7b2;--pill:#2b2e36;--divider:#323640;--outline:#3b4049;--orange:#FF7A00;--gradient:radial-gradient(ellipse at 72% -12%,#1f304e 0%,transparent 46%),radial-gradient(ellipse at 100% -15%,#542d1d 0%,transparent 25%),#0e121f}
[data-theme="dark"] body{background:var(--gradient)}
.player-controls{display:grid;grid-template-columns:64px 66px 64px;gap:29px;justify-content:center;align-items:center;margin:28px 0 23px;width:100%}
.player-controls button{display:grid;place-items:center;width:54px;height:54px;padding:0;margin:auto}
.player-controls .big-play{width:62px;height:62px;border-radius:50%;box-shadow:none;color:#fff}
.player-controls .big-play svg{width:29px;height:29px;fill:none;stroke:none;color:white;display:block}
.player-controls button:not(.big-play) svg{width:29px;height:29px;color:var(--ink);fill:none;stroke:none}
.player-actions{align-items:center;margin:0 5px 15px}
.player-actions button{display:flex;align-items:center;flex-direction:column;gap:2px;justify-content:center;min-width:31px;min-height:36px}
.microphone-icon{font-size:27px;line-height:23px}.karaoke-label{font-size:9px}
.artist-under-title,.artist-under-album{color:var(--secondary);font-size:18px;display:block;text-align:center;margin:6px auto 0;background:none;border:none;padding:3px}
.artist-under-album{text-align:left;margin:3px 0 8px;font-size:14px}
.catalog-result{display:flex;align-items:center;text-align:left;gap:12px;padding:6px 0;background:none;border:0;width:100%;min-height:68px}
.catalog-result img,.catalog-result .placeholder-cover{height:54px;width:54px;object-fit:cover;border-radius:11px;flex-shrink:0}
.catalog-result span:nth-child(2){flex:1;min-width:0}.catalog-result strong,.catalog-result small{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.catalog-result strong{font-size:14px}.catalog-result small{font-size:12px;color:var(--secondary);margin-top:5px}.catalog-chevron{font-size:22px;color:var(--secondary)}
.artist-hero{height:225px;border-radius:22px;background:var(--pill);overflow:hidden;position:relative;margin-bottom:14px}
.artist-hero img{width:100%;height:100%;object-fit:cover}
.artist-hero:after{content:"";position:absolute;inset:34% 0 0;background:linear-gradient(transparent,#000d)}
.artist-hero-caption{position:absolute;z-index:1;left:17px;right:13px;bottom:15px;color:white}
.artist-hero-caption h1{font-size:32px;line-height:1.05;margin:0 0 5px}.artist-hero-caption small{font-size:12px;color:#e2e1e5}
.artist-buttons{display:flex;gap:12px;margin:12px 0 25px}.artist-buttons button{border:1px solid var(--outline);border-radius:35px;padding:11px 24px;background:transparent;font-size:14px;font-weight:650}.artist-buttons .primary{background:var(--orange);border-color:var(--orange);color:white}
.artist-bio{font-size:13px;line-height:1.7;color:var(--secondary);padding-bottom:32px}
.karaoke-switch{display:flex;align-items:center;gap:8px;margin:0 0 16px}
.karaoke-switch button{flex:1;min-height:37px;background:var(--pill);border:1px solid var(--outline);border-radius:20px;color:var(--ink);font-size:12px}
.karaoke-switch button.active{background:var(--orange);color:white;border-color:var(--orange)}
.karaoke-lines{flex:1;min-height:190px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;display:flex;flex-direction:column;gap:17px;padding:20px 8px 32px;text-align:center;mask-image:linear-gradient(transparent,#000 10%,#000 85%,transparent)}
.karaoke-lines::-webkit-scrollbar{display:none}
.lyric-line{font-size:21px;line-height:1.3;color:var(--secondary);opacity:.75;transition:color .2s,opacity .2s,transform .2s}
.lyric-line.active{color:var(--orange);font-weight:780;opacity:1;transform:scale(1.045)}
.karaoke-message{margin:auto;color:var(--secondary);font-size:14px}
.player-screen .scroll-area{min-height:0}.player-screen .wave-timeline{flex-shrink:0}
@media(max-width:620px){.player-controls{grid-template-columns:64px 68px 64px;gap:clamp(20px,8vw,45px)}.artist-hero{height:265px}.lyric-line{font-size:clamp(21px,5.5vw,27px)}}

/* Home-library integrations respect the approved Flat UIX language */

.server-rows{margin:4px 0 22px}.server-rows .song-row{border-bottom:1px solid var(--outline)}
.server-tag{font-size:10px;color:var(--orange);margin-top:3px}
