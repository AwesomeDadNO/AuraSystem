plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}
android {
    namespace 'com.aura.amp'
    compileSdk 36
    defaultConfig {
        applicationId 'com.aura.amp'
        minSdk 26
        targetSdk 34
        buildConfigField 'String', 'SPOTIFY_CLIENT_ID', '"a9afa6f845ee4b99b0e903186d7e03e3"' 
        versionCode (System.getenv('AURA_RELEASE_VERSION_CODE')?.toInteger() ?: 10307)
        versionName '1.3.7-alpha'
        buildConfigField 'String', 'AURA_UPDATE_URL', groovy.json.JsonOutput.toJson(System.getenv('AURA_UPDATE_URL') ?: '')
    }
    // Signed releases require the same persistent key on every build.
    def releaseStore = System.getenv('AURA_ANDROID_KEYSTORE_PATH')
    def releasePass = System.getenv('AURA_ANDROID_KEYSTORE_PASSWORD')
    def releaseAlias = System.getenv('AURA_ANDROID_KEY_ALIAS')
    def releaseKeyPass = System.getenv('AURA_ANDROID_KEY_PASSWORD')
    def signingReady = releaseStore && releasePass && releaseAlias && releaseKeyPass
    signingConfigs {
        if (signingReady) {
            auraRelease {
                storeFile file(releaseStore)
                storePassword releasePass
                keyAlias releaseAlias
                keyPassword releaseKeyPass
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (signingReady) signingConfig signingConfigs.auraRelease
        }
    }
    buildFeatures {
        buildConfig true
        compose true
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += ['-Xskip-metadata-version-check']
    }
    packagingOptions {
        resources {
            excludes += [
                'META-INF/versions/9/OSGI-INF/MANIFEST.MF',
                'META-INF/OSGI-INF/MANIFEST.MF'
            ]
        }
    }
}

// Google Cast pulls MediaRouter 1.9.0-beta01 transitively, which requires
// compileSdk 37 / AGP 9.1. Pin the compatible stable version across configurations.
configurations.configureEach {
    resolutionStrategy.force 'androidx.mediarouter:mediarouter:1.8.1'
    resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib:2.0.21'
    resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.0.21'
    resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.0.21'
}

dependencies {
    // Jetpack Compose & UI
    implementation platform('androidx.compose:compose-bom:2024.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.navigation:navigation-compose:2.8.3'
    implementation 'io.coil-kt:coil-compose:2.7.0'

    // Room DB
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    // Media & Cast
    implementation 'androidx.media3:media3-exoplayer:1.11.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.11.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.11.1'
    implementation 'androidx.media3:media3-session:1.11.1'
    implementation 'androidx.media3:media3-common:1.11.1'
    implementation 'com.google.android.gms:play-services-cast-framework:23.0.0'
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
    implementation 'androidx.mediarouter:mediarouter:1.8.1'
    implementation 'com.google.guava:guava:33.4.8-android'
    // AuraConnect controller & AuraMusic engine (built from source via includeBuild).
    implementation 'no.aura.connect:auraconnect-android:3.0.0-ac2'
    implementation 'no.aura.music:auramusic-engine:1.0.0'
    implementation project(':Modules:AuraMusicEngine')
}
